name: CI

# 触发条件：推送到主分支 / 所有 PR / 手动触发
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 最小权限：CI 只需要读代码
permissions:
  contents: read

# 同一分支的新提交会取消上一次未跑完的任务，避免排队浪费
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 0. 探测：三个板块是否已创建
  #    目前仓库里 java-service 仅含 P01 骨架，python-rag 已有配置与用例，
  #    web 尚未创建，因此 web 的 job 会因 `if` 不满足而被跳过（灰色，不算失败）。
  #    等对应目录出现后，自动开始跑，无需改这个文件。
  # ---------------------------------------------------------------------------
  detect:
    name: 探测模块
    runs-on: ubuntu-latest
    outputs:
      java: ${{ steps.check.outputs.java }}
      python: ${{ steps.check.outputs.python }}
      web: ${{ steps.check.outputs.web }}
    steps:
      - uses: actions/checkout@v4

      - name: 检查各板块是否存在
        id: check
        run: |
          set -euo pipefail

          # Java：以 Maven 构建脚本或 Wrapper 的存在为准
          if [ -f java-service/pom.xml ] \
            || [ -f java-service/mvnw ]; then
            echo "java=true" >> "$GITHUB_OUTPUT"
            JAVA_STATE="✅ 已存在，将执行编译与单测"
          else
            echo "java=false" >> "$GITHUB_OUTPUT"
            JAVA_STATE="⏭️ 未创建（缺少 java-service/pom.xml 或 mvnw）"
          fi

          # Python：以依赖声明或 tests 目录为准
          if [ -f python-rag/requirements.txt ] \
            || [ -f python-rag/pyproject.toml ] \
            || [ -d python-rag/tests ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
            PY_STATE="✅ 已存在，将执行单测"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
            PY_STATE="⏭️ 未创建（缺少 python-rag/requirements.txt 或 pyproject.toml）"
          fi

          # Web：以 package.json 的存在为准
          if [ -f web/package.json ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            WEB_STATE="✅ 已存在，将执行构建与前端测试"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
            WEB_STATE="⏭️ 未创建（缺少 web/package.json）"
          fi

          # 把探测结果写进 Job Summary，一眼看出"是模块没建，不是测试挂了"
          {
            echo "## CI 模块探测结果"
            echo ""
            echo "| 板块 | 预期目录 | 状态 |"
            echo "|---|---|---|"
            echo "| Java 业务服务 | \`java-service/\` | $JAVA_STATE |"
            echo "| Python RAG 服务 | \`python-rag/\` | $PY_STATE |"
            echo "| 前端 | \`web/\` | $WEB_STATE |"
            echo ""
            echo "> 未创建的板块会被跳过（显示为 skipped），不会让流水线变红。"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 1. Java：Spring Boot 3 + Maven（UD-09：构建工具为 Maven，不用 Gradle）
  # ---------------------------------------------------------------------------
  java:
    name: Java 业务服务
    needs: detect
    if: needs.detect.outputs.java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # JDK 21（LTS）：虚拟线程在 21 正式转正（JEP 444），无需 --enable-preview。
      # 版本已在 03 号 §3.9 定稿（技术文档 §3.1 允许 17/21，本项目取 21）。
      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 确认 JDK 版本不低于 21
        working-directory: java-service
        run: |
          set -euo pipefail
          java -version
          # 只要低于 21，虚拟线程就不可用（21 之前是预览特性），直接拦在这里
          java -version 2>&1 | grep -qE 'version "2[1-9]\.' || {
            echo "::error::当前 JDK 低于 21，虚拟线程不可用"
            exit 1
          }

      # generate-sources 会先用 protoc 生成 gRPC 代码；test 再做编译与单测。
      # 用 -B（批处理输出）+ -ntp（不打印下载进度）让日志可读。
      - name: 生成 proto 代码、编译并运行单元测试
        working-directory: java-service
        env:
          # 强制让测试跑在虚拟线程上：Spring Boot 的 relaxed binding 会把
          # SPRING_THREADS_VIRTUAL_ENABLED 映射到 spring.threads.virtual.enabled，
          # 环境变量会被 Maven Surefire 的 fork 进程继承，因此能覆盖配置文件里的值。
          # 如果哪天有人把配置改回平台线程，CI 仍按虚拟线程跑，行为差异会在这里暴露。
          SPRING_THREADS_VIRTUAL_ENABLED: 'true'
        run: |
          set -euo pipefail
          mvn -B -ntp clean generate-sources test

      # 失败时把测试报告带出来，否则只能看日志猜
      - name: 上传测试报告（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: java-service/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. Python：RAG 服务（grpc.aio + Qdrant + LLM Provider）
  # ---------------------------------------------------------------------------
  python:
    name: Python RAG 服务
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 用 actions/cache 而不是 setup-python 的 cache 参数：
      # 后者在依赖文件缺失时会直接报错，而这里 hashFiles 为空也只是缓存不命中
      - name: 缓存 pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('python-rag/requirements*.txt', 'python-rag/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 安装依赖
        working-directory: python-rag
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip install -e .
          fi
          # 测试框架单独装，避免项目依赖里漏掉
          pip install pytest pytest-asyncio pytest-cov

      # proto 是 Java/Python 的共享契约，必须**生成到工程目录**，不能只编译到临时目录。
      #
      # 踩过的坑：这里原本只把 proto 编译到 /tmp 做"能否编译"的校验，而生成物是被
      # .gitignore 排除的。P02 起测试会 import app.grpc_gen_loader（加载生成的桩代码），
      # 于是 CI 在**用例收集阶段**就报：
      #   RuntimeError: 未找到 proto 生成物，请先在 python-rag 目录执行 make proto
      # 本地因为跑过 make proto 而不复现，属于典型的"只有 CI 才炸"。
      #
      # make proto 顺带会校验两侧 protoc 版本一致（读 java-service/pom.xml），
      # 所以它同时替代了原先的"可编译"校验。
      - name: 生成 proto 代码（含两侧 protoc 版本一致性校验）
        working-directory: python-rag
        run: make proto PY=python3

      - name: 运行单元测试
        working-directory: python-rag
        run: |
          set -uo pipefail
          if [ -d tests ]; then
            # pytest 在"未收集到用例"时退出码是 5，这不算失败（模块刚搭好还没写用例）
            python -m pytest -q --maxfail=1
            code=$?
            if [ "$code" -eq 5 ]; then
              echo "::notice::tests/ 存在但未收集到用例，按跳过处理"
              exit 0
            fi
            exit "$code"
          else
            echo "::notice::python-rag/tests 不存在，退化为语法检查"
            python -m compileall -q .
          fi

  # ---------------------------------------------------------------------------
  # 3. Web：Vue 3 + TypeScript + Element Plus（Vite）
  # ---------------------------------------------------------------------------
  web:
    name: 前端
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 缓存 npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json', 'web/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: 安装依赖
        working-directory: web
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            # 尚无 lock 文件时退回 install，并提示后续应提交 lock
            echo "::notice::web/package-lock.json 不存在，使用 npm install；建议后续提交 lock 文件以启用 npm ci"
            npm install --no-audit --no-fund
          fi

      # --if-present：脚本不存在就跳过，不会失败（框架还没搭好时也能过）
      - name: 类型检查
        working-directory: web
        run: npm run type-check --if-present

      - name: 构建
        working-directory: web
        run: npm run build --if-present

      - name: 运行前端测试
        working-directory: web
        env:
          # Vitest / Jest 在 CI 环境下都会自动退出 watch 模式
          CI: 'true'
        run: npm run test --if-present

      - name: 上传构建产物（失败时排查用）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-build-logs
          path: |
            web/dist/
            web/npm-debug.log
          if-no-files-found: ignore
          retention-days: 7
