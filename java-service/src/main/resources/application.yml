# =============================================================================
# Java 业务服务配置（P01 脚手架）
#
# 约定（03 §9）：
#   · 必填项写成「${VAR:}」（缺省为空串），再由 AppProperties 上的 @NotBlank 拦截，
#     失败信息写明环境变量名。不能写成无默认值的 ${VAR}：Spring Boot 绑定
#     @ConfigurationProperties 时会忽略无法解析的占位符，变量缺失时值是字面量
#     "${VAR}"（非空），@NotBlank 拦不住，服务会带着假配置启动成功；
#   · 可选项写成「${VAR:默认值}」，默认值均来自 03 §9.1；
#   · Secret 类值只从环境注入，禁止写进本文件、禁止入 Git（NFR-12/NFR-13）。
#
# P01 不引入 JDBC 依赖，因此 JAVA_DB_* 暂不在此绑定（P05 接入 MyBatis-Plus 时补上），
# 变量清单见仓库根 .env.example。
# =============================================================================

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: java-service
  threads:
    virtual:
      # JDK 21 虚拟线程（UD-08 之前的技术裁决，03 §3.9；CI 亦以此环境变量强制开启）
      enabled: ${SPRING_THREADS_VIRTUAL_ENABLED:true}

logging:
  level:
    root: ${LOG_LEVEL:INFO}

app:
  hmac:
    key-id: ${HMAC_KEY_ID:}                       # 必填
    secret: ${HMAC_SECRET:}                       # 必填 · Secret
    clock-skew-seconds: ${HMAC_CLOCK_SKEW_SECONDS:60}
  rag:
    host: ${RAG_HOST:}                            # 必填（单机基线 127.0.0.1）
    port: ${RAG_PORT:50051}
    tls:
      enabled: ${RAG_TLS_ENABLED:true}           # 禁止置 false（NFR-03）
      ca-path: ${RAG_TLS_CA_PATH:}                # 必填
      override-authority: ${RAG_TLS_OVERRIDE_AUTHORITY:}
    timeouts:
      chat-ms: ${RAG_CHAT_TIMEOUT_MS:180000}
      ingest-ms: ${RAG_INGEST_TIMEOUT_MS:300000}
      unary-ms: ${RAG_UNARY_TIMEOUT_MS:10000}
  jwt:
    secret: ${JWT_SECRET:}                        # 必填 · Secret（建议 ≥32 字节）
    expire-seconds: ${JWT_EXPIRE_SECONDS:7200}
    blacklist-enabled: ${JWT_BLACKLIST_ENABLED:false}   # 待确认 Q-15
  sse:
    timeout-ms: ${SSE_TIMEOUT_MS:180000}
    heartbeat-ms: ${SSE_HEARTBEAT_MS:15000}
  chat:
    question-max-len: ${CHAT_QUESTION_MAX_LEN:500}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}     # 必填，显式白名单，禁止 *
  upload:
    max-bytes: ${UPLOAD_MAX_BYTES:10485760}      # 10 MB，建议值待确认
    allowed-ext: ${UPLOAD_ALLOWED_EXT:md,txt}
    chunk-bytes: ${UPLOAD_CHUNK_BYTES:524288}    # 512 KB，建议值
  ratelimit:
    enabled: ${RATELIMIT_ENABLED:true}
    chat-per-min: ${RATELIMIT_CHAT_PER_MIN:20}   # 建议值待确认 Q-14
    login-per-min: ${RATELIMIT_LOGIN_PER_MIN:10} # 建议值待确认 Q-14
