# P01 骨架：Python 侧依赖的 Qdrant。
#
# 说明：
#   · 真正的单机终版 Compose 在 P12 交付（deploy/docker-compose.yml）；
#     本文件只负责「本地把 Qdrant 拉起来」，给 P04 的入库与检索使用。
#   · rag-service 的镜像构建（Dockerfile）随 P12 提供，因此这里不声明 rag-service。
#   · 6333（HTTP）/6334（gRPC）只监听 127.0.0.1，不暴露到 0.0.0.0（NFR-07 精神）。
name: student-rag-python

services:
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: student-rag-qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  qdrant-data:
